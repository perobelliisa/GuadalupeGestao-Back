name: Deploy Guadalupe backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guadalupe-back-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger EasyPanel deployment
        env:
          DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          test -n "$DEPLOY_URL"
          curl --fail --show-error --silent --max-time 30 --request POST "$DEPLOY_URL"
